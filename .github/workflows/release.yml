# Release workflow. Push a tag matching the version in Cargo.toml, like v2.0.1
# (`git tag v2.0.1 && git push --tags`), and it will
#   1. test on macOS, build a universal binary, create the release and attach it,
#   2. build the Linux and Windows programs (the same workflows PRs run) and attach them,
#   3. update Formula/azure-devops-board.rb in aavishay/homebrew-azure-devops-board with the new version and checksums.
# Also runnable by hand from the Actions tab to re-cut an existing tag.
# Step 3 needs the repo secret TAP_DEPLOY_KEY: the private half of a write-enabled deploy key on the tap.
# Without it the formula is skipped.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # Creates the release. Every other job that attaches to it waits for this one,
  # so two jobs never race to create it.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # Without the x86_64 slice the program would refuse to run on Intel Macs.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches Cargo.toml
        run: |
          VER=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          [ "${TAG#v}" = "$VER" ] || { echo "::error::tag $TAG does not match the version in Cargo.toml ($VER)"; exit 1; }

      - name: Test
        run: cargo test --locked

      - name: Build a universal binary
        run: |
          set -euo pipefail
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$t"
          done
          mkdir -p universal
          lipo -create -output universal/azure-devops-board \
            target/aarch64-apple-darwin/release/azure-devops-board \
            target/x86_64-apple-darwin/release/azure-devops-board
          # Ad-hoc signed, as each slice was: Apple Silicon refuses to run unsigned code.
          codesign --force --sign - universal/azure-devops-board

      - name: Verify the binary really is universal
        run: |
          set -euo pipefail
          ARCHS=$(lipo -archs universal/azure-devops-board)
          echo "architectures: $ARCHS"
          for want in arm64 x86_64; do
            case "$ARCHS" in *"$want"*) ;; *) echo "::error::missing $want slice"; exit 1 ;; esac
          done
          codesign --verify --verbose universal/azure-devops-board

      - name: Start it and check it serves the board
        run: scripts/smoke-test.sh universal/azure-devops-board

      - name: Package and checksum it
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf "dist/azure-devops-board-${TAG#v}-macos-universal.tar.gz" -C universal azure-devops-board
          cd dist
          shasum -a 256 -- * | tee SHA256SUMS.txt

      # Retried: the action uploads the files concurrently, and GitHub sometimes
      # answers one of them with a 500. Re-attaching a file that already landed is
      # harmless, since the action replaces an asset of the same name.
      - uses: softprops/action-gh-release@v3
        id: publish
        continue-on-error: true
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*
          generate_release_notes: true
          body_path: .github/release-body.md

      - name: Retry attaching the macOS assets
        if: steps.publish.outcome == 'failure'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*
          # Same body and notes as the first attempt, in case it failed before the
          # release existed. A supplied body replaces the existing text before the
          # notes are added, so this cannot leave two copies of them.
          generate_release_notes: true
          body_path: .github/release-body.md

      # A success from the action is not the same fact as the assets being there,
      # so ask GitHub. Matched by whole name, so a near-miss rename can't pass.
      - name: Confirm every macOS asset is on the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "${{ steps.publish.outcome }}" = "failure" ] && echo "::warning::attaching the macOS assets failed once and was retried"
          VER="${TAG#v}"
          NAMES=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "$NAMES"
          MISSING=0
          for want in "azure-devops-board-$VER-macos-universal.tar.gz" "SHA256SUMS.txt"; do
            printf '%s\n' "$NAMES" | grep -Fxq -- "$want" || { echo "::error::the release is missing $want"; MISSING=1; }
          done
          [ "$MISSING" -eq 0 ]

  # Built by the same workflows pull requests run. They hold no write access and
  # produce only an artifact; the publish jobs below attach it.
  linux:
    uses: ./.github/workflows/linux.yml
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}

  windows:
    uses: ./.github/workflows/windows.yml
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}

  linux-publish:
    needs: [macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: dist

      # No body or release notes: the macOS job owns those.
      - uses: softprops/action-gh-release@v3
        id: publish
        continue-on-error: true
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*

      - name: Retry attaching the Linux assets
        if: steps.publish.outcome == 'failure'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*

      - name: Confirm the Linux assets are on the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "${{ steps.publish.outcome }}" = "failure" ] && echo "::warning::attaching the Linux assets failed once and was retried"
          VER="${TAG#v}"
          NAMES=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "$NAMES"
          MISSING=0
          for want in "azure-devops-board-$VER-linux-x86_64.tar.gz" "SHA256SUMS-linux.txt"; do
            printf '%s\n' "$NAMES" | grep -Fxq -- "$want" || { echo "::error::the release is missing $want"; MISSING=1; }
          done
          [ "$MISSING" -eq 0 ]

  windows-publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist

      - uses: softprops/action-gh-release@v3
        id: publish
        continue-on-error: true
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*

      - name: Retry attaching the Windows assets
        if: steps.publish.outcome == 'failure'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*

      - name: Confirm the Windows assets are on the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "${{ steps.publish.outcome }}" = "failure" ] && echo "::warning::attaching the Windows assets failed once and was retried"
          VER="${TAG#v}"
          NAMES=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "$NAMES"
          MISSING=0
          for want in "azure-devops-board-$VER-windows-x64.zip" "SHA256SUMS-windows.txt"; do
            printf '%s\n' "$NAMES" | grep -Fxq -- "$want" || { echo "::error::the release is missing $want"; MISSING=1; }
          done
          [ "$MISSING" -eq 0 ]

  # Takes the archives from the published release, so the formula's checksums are of
  # the exact files users download.
  formula:
    needs: [macos, linux-publish]
    runs-on: ubuntu-latest
    env:
      TAP_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check for the tap deploy key
        if: env.TAP_KEY == ''
        run: echo "::warning::TAP_DEPLOY_KEY is not set, so the Homebrew formula was not updated."

      - uses: actions/checkout@v7
        if: env.TAP_KEY != ''

      - name: Download the macOS and Linux archives from the release
        if: env.TAP_KEY != ''
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern '*-macos-universal.tar.gz' --pattern '*-linux-x86_64.tar.gz'

      - uses: actions/checkout@v7
        if: env.TAP_KEY != ''
        with:
          repository: aavishay/homebrew-azure-devops-board
          ssh-key: ${{ env.TAP_KEY }}
          path: tap

      - name: Update the formula
        if: env.TAP_KEY != ''
        run: |
          VER="${TAG#v}"
          scripts/update-formula.sh "$VER" \
            "dist/azure-devops-board-$VER-macos-universal.tar.gz" \
            "dist/azure-devops-board-$VER-linux-x86_64.tar.gz" \
            tap/Formula/azure-devops-board.rb
          cd tap
          if git diff --quiet; then echo "Formula already at $VER."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "azure-devops-board $VER"
          git push
