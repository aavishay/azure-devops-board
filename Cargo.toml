[package]
name = "azure-devops-board"
version = "1.2.0"
description = "DevOps Team Board: an Azure DevOps kanban that runs in your browser"
authors = ["AU10TIX DevOps"]
edition = "2021"
rust-version = "1.89"
# The UI is embedded from ui/ at build time.
include = ["src/**", "ui/**", "Cargo.toml", "Cargo.lock", "README.md"]

[[bin]]
name = "azure-devops-board"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
rust-embed = { version = "8", features = ["mime-guess"] }
open = "5"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
tokio = { version = "1", features = ["net", "time", "io-util", "sync", "macros", "rt-multi-thread", "signal"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
