# Builds the azure-devops-board program for Windows, macOS and Linux as pipeline artifacts.
# GitHub releases come from .github/workflows/release.yml; this is for teams that prefer Azure Pipelines.
trigger:
  branches: { include: [main] }
  tags: { include: ['v*'] }

strategy:
  matrix:
    windows: { imageName: 'windows-latest' }
    macos:   { imageName: 'macOS-latest' }
    linux:   { imageName: 'ubuntu-22.04' }

pool:
  vmImage: $(imageName)

steps:
  - script: |
      sudo apt-get update
      sudo apt-get install -y libdbus-1-dev pkg-config
    displayName: Linux build dependencies
    condition: eq(variables['Agent.OS'], 'Linux')

  - script: rustup update stable && rustup default stable
    displayName: Rust toolchain

  - script: cargo test --locked
    displayName: Test

  - script: cargo build --release --locked
    displayName: Build

  - task: CopyFiles@2
    displayName: Collect the program
    inputs:
      sourceFolder: target/release
      contents: |
        azure-devops-board
        azure-devops-board.exe
      targetFolder: $(Build.ArtifactStagingDirectory)

  - task: PublishPipelineArtifact@1
    displayName: Publish the program
    inputs:
      targetPath: $(Build.ArtifactStagingDirectory)
      artifact: azure-devops-board-$(Agent.OS)
